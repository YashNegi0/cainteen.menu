{% extends "base.html" %}
{% block body %}
<h2>Students</h2>
<form method="post" class="row card">
  <input name="name" placeholder="Full name" required>
  <input name="email" type="email" placeholder="Email" required>
  <button>Add Student</button>
</form>
<div class="card">
<table>
<thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Orders</th><th>Spent</th><th></th></tr></thead>
<tbody>
{% for r in rows %}
<tr>
  <td>{{ r.student_id }}</td>
  <td><input form="e{{ r.student_id }}" name="name" value="{{ r.name }}" required></td>
  <td><input form="e{{ r.student_id }}" name="email" type="email" value="{{ r.email }}" required></td>
  <td>{{ r.orders }}</td>
  <td>Rs. {{ '%.2f'|format(r.spent) }}</td>
  <td><form id="e{{ r.student_id }}" method="post" action="{{ url_for('student_edit', i=r.student_id) }}"></form>
  <button form="e{{ r.student_id }}">Save</button>
  <form method="post" action="{{ url_for('student_delete', i=r.student_id) }}" onsubmit="return confirm('Delete student?')"><button class="danger">Delete</button></form></td>
</tr>
{% else %}<tr><td colspan="6">No students yet</td></tr>{% endfor %}
</tbody>
</table>
</div>
{% endblock %}
